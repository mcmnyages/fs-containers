services:
  frontend:
    build:
      context: ./bloglist-frontend
      dockerfile: Dockerfile
    depends_on:
      - backend

  backend:
    build:
      context: ./bloglist_backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3003
      MONGO_URL: mongodb://mongo:27017/bloglist
      SECRET: ${SECRET}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  mongo_data: